<!doctype html>
<html lang="en"><head><meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1" /><title>Prosopon</title><style>
body{width:300px;margin:0;font:14px/1.45 system-ui,sans-serif;color:#1d1d1f;background:#fafafa}main{padding:18px}h1{font-size:18px;margin:0}.intro{margin:4px 0 16px}.section{border-top:1px solid #ddd;padding-top:14px}.section h2{font-size:15px;margin:0 0 3px}.label{color:#666}.model{margin:12px 0;padding:10px;background:#f0f0f2;border-radius:8px}button{width:100%;padding:9px;border:0;border-radius:7px;background:#1967d2;color:white;font-weight:600;cursor:pointer}button+button{margin-top:8px}.secondary{background:#e6e6e9;color:#222}.danger{background:#b3261e}.hidden{display:none}progress{width:100%;height:8px;margin:8px 0}@media(prefers-color-scheme:dark){body{background:#202124;color:#f1f3f4}.section{border-color:#45464a}.label{color:#bdc1c6}.model{background:#303134}.secondary{background:#45464a;color:#f1f3f4}}</style></head>
<body><main><h1>Prosopon</h1><p class="label intro">Avatar and lip-sync work without emotion analysis.</p><button id="avatar-toggle">Enable avatar</button><p id="avatar-status" class="label"></p><section class="section" aria-labelledby="emotion-title"><h2 id="emotion-title">Emotion Intelligence <span class="label">(optional)</span></h2><p class="label">Local voice valence and arousal analysis. Off by default.</p><div class="label">Status: <strong id="status">Loading…</strong></div><div class="model">Model:<br><strong>DistilHuBERT SER INT8</strong><br><span class="label">~51 MB · local processing</span></div><div id="progress" class="hidden"><span id="progress-label">Downloading emotion model…</span><progress id="bar" max="50630102" value="0"></progress><span id="bytes"></span></div><p id="error" class="hidden"></p><button id="install">Install & Enable emotions</button><button id="cancel" class="secondary hidden">Cancel</button><button id="disable" class="secondary hidden">Disable emotions</button><button id="remove" class="danger hidden">Remove emotion model</button></section></main><script type="module" src="./popup.ts"></script></body></html>
