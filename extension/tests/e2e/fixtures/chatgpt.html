<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ChatGPT (fixture)</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; background: #fff; }
      #app { min-height: 100vh; display: flex; flex-direction: column; }
      #thread { flex: 1; padding: 16px; }
      [data-thread-focus-mode] {
        position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #fafafa;
      }
      [data-realtime-voice-orb] { width: 180px; height: 180px; border-radius: 50%; background: #4a8cff; }
      #close-voice { position: absolute; bottom: 32px; }
      /* Hostile page styles: must not reach the overlay. */
      div { box-sizing: content-box; }
      canvas { border: 10px solid red !important; opacity: 0.1 !important; }
    </style>
  </head>
  <body>
    <!-- Mimics the parts of chatgpt.com that ChatGPTAdapter knows; see CHATGPT_SELECTORS. -->
    <div id="app">
      <div id="thread" data-chatgpt-conversation-selection-target="true"><p>Fixture conversation</p></div>
      <!-- Calibration automation: current localized ChatGPT Voice shape (see docs/calibration-wizard.md). -->
      <button type="button" id="new-chat">Новий чат</button>
      <form id="composer">
        <textarea id="prompt-textarea" aria-label="Message"></textarea>
        <button type="submit" id="send" disabled>Send</button>
        <button type="button" aria-label="Почати голосову розмову" id="open-voice">Voice</button>
      </form>
    </div>
    <script>
      const app = document.getElementById('app');
      const composer = document.getElementById('prompt-textarea');
      const send = document.getElementById('send');
      composer.addEventListener('input', () => (send.disabled = composer.value.trim() === ''));
      document.getElementById('composer').addEventListener('submit', (event) => {
        event.preventDefault();
        if (send.disabled) return;
        const text = composer.value;
        composer.value = '';
        send.disabled = true;
        void window.fixture.onSend(text);
      });
      document.getElementById('open-voice').addEventListener('click', () => window.fixture.openVoice());
      document.getElementById('new-chat').addEventListener('click', () => {
        document.querySelectorAll('[data-message-author-role]').forEach((m) => m.remove());
      });
      let speech = null;
      window.fixture = {
        voice: 'Sol',
        muted: false,
        /** Messages the composer sent (calibration E2E). */
        sent: [],
        /** Speech rate of the fake voice, characters per second. */
        charsPerSecond: 16,
        /**
         * A typed message: shows it, then answers. The calibration prompts end with the text to say in quotes; the
         * fixture "says" it (streams it as the reply and, in a voice session, plays speech for its length).
         */
        async onSend(text) {
          this.sent.push(text);
          const user = document.createElement('div');
          user.dataset.messageAuthorRole = 'user';
          user.dataset.messageId = `u${this.sent.length}`;
          user.textContent = text;
          document.getElementById('thread').append(user);
          const quoted = /"([\s\S]*)"\s*$/.exec(text)?.[1] ?? 'Ready.';
          await new Promise((r) => setTimeout(r, 300));
          const voice = !!document.querySelector('[data-thread-focus-mode]');
          if (voice) this.playSpeech();
          const seconds = quoted.length / this.charsPerSecond;
          await this.streamReply(`a${this.sent.length}`, [quoted], (seconds * 1000) / Math.max(1, quoted.split(/\s+/).length));
          if (voice) {
            await new Promise((r) => setTimeout(r, 200));
            this.stopSpeech();
          }
        },
        // Mirrors production chatgpt.com (2026-09-26): a decorative aria-hidden orb inside its button, inside
        // the focus-mode container, plus the localized end-session control. React unmounts all of it when voice ends.
        openVoice() {
          if (document.querySelector('[data-thread-focus-mode]')) return;
          const container = document.createElement('div');
          container.dataset.threadFocusMode = 'true';
          const button = document.createElement('button');
          button.type = 'button';
          button.setAttribute('aria-label', 'Перейти в режим фокусування на голосі');
          button.setAttribute('aria-pressed', 'true');
          const orb = document.createElement('div');
          orb.dataset.realtimeVoiceOrb = 'true';
          orb.dataset.testid = 'avatar-overlay-voice-orb';
          orb.setAttribute('aria-hidden', 'true');
          button.append(orb);
          const close = document.createElement('button');
          close.id = 'close-voice';
          close.setAttribute('aria-label', 'Завершити сеанс у режимі «Голос»');
          close.textContent = 'End';
          close.onclick = () => window.fixture.closeVoice();
          const mute = document.createElement('button');
          mute.type = 'button';
          mute.id = 'mute-voice';
          mute.setAttribute('aria-label', 'Вимкнути мікрофон');
          mute.onclick = () => {
            window.fixture.muted = !window.fixture.muted;
            mute.setAttribute('aria-label', window.fixture.muted ? 'Увімкнути мікрофон' : 'Вимкнути мікрофон');
          };
          const voiceName = document.createElement('span');
          voiceName.setAttribute('aria-label', `Voice: ${window.fixture.voice}`);
          container.append(button, close, mute, voiceName);
          app.append(container);
        },
        closeVoice() {
          document.querySelector('[data-thread-focus-mode]')?.remove();
        },
        /** React-like churn: many unrelated mutations. */
        churn(n) {
          const thread = document.getElementById('thread');
          for (let i = 0; i < n; i++) {
            const p = document.createElement('p');
            p.textContent = `token ${i}`;
            thread.append(p);
            if (i % 3 === 0) p.remove();
          }
        },
        /**
         * An assistant reply as chatgpt.com renders it (unverified against production, see
         * docs/semantic-calibration.md): an element with data-message-author-role="assistant" and a .markdown body,
         * streamed as text tokens every `ms`. Resolves when the whole text is on the page.
         */
        streamReply(id, paragraphs, ms = 20) {
          const message = document.createElement('div');
          message.dataset.messageAuthorRole = 'assistant';
          message.dataset.messageId = id;
          const body = document.createElement('div');
          body.className = 'markdown prose';
          message.append(body);
          document.getElementById('thread').append(message);
          const tokens = paragraphs.map((p) => p.match(/\S+\s*/g) ?? []);
          return new Promise((resolve) => {
            let para = -1;
            let i = 0;
            let node = null;
            const step = () => {
              if (!node || i >= tokens[para].length) {
                para++;
                i = 0;
                if (para >= tokens.length) return resolve();
                const p = document.createElement('p');
                node = document.createTextNode('');
                p.append(node);
                body.append(p);
              }
              node.data += tokens[para][i++];
              setTimeout(step, ms);
            };
            step();
          });
        },
        /**
         * Production Voice Mode transcript shape observed on 2026-09-26. Its assistant turn is not the regular
         * data-message-author-role/.markdown pair: an sr-only semantic heading labels the turn and a data-markdown
         * body streams in place under an immutable selection message id.
         */
        streamVoiceReply(id, paragraphs, ms = 20) {
          const turn = document.createElement('div');
          turn.dataset.contentSearchUnitKey = `fallback-turn-${document.querySelectorAll('[data-content-search-unit-key]').length}:1:assistant`;
          const heading = document.createElement('h4');
          heading.dataset.conversationRole = 'assistant';
          heading.textContent = 'ChatGPT said:';
          const selection = document.createElement('div');
          selection.dataset.chatgptSelectionMessageId = id;
          const body = document.createElement('div');
          body.dataset.markdownTextStyle = 'assistant-message';
          selection.append(body);
          turn.append(heading, selection);
          document.getElementById('thread').append(turn);
          const tokens = paragraphs.map((p) => p.match(/\S+\s*/g) ?? []);
          return new Promise((resolve) => {
            let para = -1;
            let i = 0;
            let node = null;
            const step = () => {
              if (!node || i >= tokens[para].length) {
                para++;
                i = 0;
                if (para >= tokens.length) return resolve();
                const p = document.createElement('p');
                node = document.createTextNode('');
                p.append(node);
                body.append(p);
              }
              node.data += tokens[para][i++];
              setTimeout(step, ms);
            };
            step();
          });
        },
        /** SPA navigation: pushState + re-render of the app shell. */
        navigate(path) {
          history.pushState({}, '', path);
          document.getElementById('thread').innerHTML = `<p>${path}</p>`;
        },
        /** Speech-like test signal (buzz with syllable-rate envelope), played by the page like ChatGPT's voice. */
        playSpeech() {
          if (speech) return;
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          osc.frequency.value = 140;
          const lowpass = ctx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.value = 1400;
          const env = ctx.createGain();
          env.gain.value = 0;
          osc.connect(lowpass).connect(env).connect(ctx.destination);
          const t0 = ctx.currentTime + 0.05;
          for (let i = 0; i < 200; i++) {
            const t = t0 + i * 0.2;
            env.gain.setValueAtTime(0.02, t);
            env.gain.linearRampToValueAtTime(0.5, t + 0.06);
            env.gain.linearRampToValueAtTime(0.02, t + 0.18);
          }
          osc.start();
          speech = { ctx };
        },
        stopSpeech() {
          speech?.ctx.close();
          speech = null;
        },
        /**
         * Two voices that differ the way a calm and an energetic reply do: level, syllable rate, intonation swing and
         * brightness. Same mechanism as playSpeech (a voiced buzz through a low-pass), so lip sync reads both.
         */
        playVoice(style) {
          if (speech) return;
          const s = style === 'energetic'
            ? { f0: 190, swing: 5, gain: 0.6, rate: 6.5, cutoff: 3200 }
            : { f0: 130, swing: 0.4, gain: 0.12, rate: 3, cutoff: 700 };
          const ctx = new AudioContext();
          const osc = ctx.createOscillator();
          osc.type = 'sawtooth';
          const lowpass = ctx.createBiquadFilter();
          lowpass.type = 'lowpass';
          lowpass.frequency.value = s.cutoff;
          const env = ctx.createGain();
          env.gain.value = 0;
          osc.connect(lowpass).connect(env).connect(ctx.destination);
          const t0 = ctx.currentTime + 0.05;
          const syl = 1 / s.rate;
          for (let i = 0; i < 400; i++) {
            const t = t0 + i * syl;
            env.gain.setValueAtTime(s.gain * 0.2, t);
            env.gain.linearRampToValueAtTime(s.gain, t + syl * 0.35);
            env.gain.linearRampToValueAtTime(s.gain * 0.2, t + syl * 0.9);
            osc.frequency.setValueAtTime(s.f0 * 2 ** ((s.swing * Math.sin(i * 0.9)) / 12), t);
          }
          osc.start();
          speech = { ctx };
        },
      };
    </script>
  </body>
</html>
